name: Archivist
options:
  bundleIdPrefix: com.krisnorthfield
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Apple Silicon only. Support: the current macOS and the one before it (now 27 and 26).
    ARCHS: arm64
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Archivist:
    type: application
    platform: macOS
    sources:
      - Archivist
    info:
      path: Archivist/Info.plist
      properties:
        CFBundleDisplayName: Archivist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
  ArchivistTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ArchivistTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Archivist
schemes:
  Archivist:
    build:
      targets:
        Archivist: all
    test:
      targets:
        - ArchivistTests
